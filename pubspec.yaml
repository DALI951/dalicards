name: dalicards
description: "DaliCards - Tunisian card games. Chkobba & Rami, solo vs bot, hotseat, or online with a friend via link."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  engine:
    path: packages/engine
  shared_preferences: ^2.3.2
  http: ^1.2.2
  share_plus: ^10.0.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
