name: apk

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_B64 != '' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        continue-on-error: true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android/ scaffolding
        run: flutter create --platforms android --org ai.dalicards --project-name dalicards .

      - name: Guard - flutter create must not clobber our sources
        run: |
          set -e
          grep -q "DaliCardsApp" lib/main.dart || { echo "FATAL: lib/main.dart overwritten"; exit 1; }
          echo "sources intact"

      - name: Drop the scaffold test flutter create drops in
        run: |
          set -e
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart; then
            rm test/widget_test.dart
            echo "removed the generated MyApp smoke test"
          fi

      - name: Internet permission (online play)
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('</manifest>', '    <uses-permission android:name="android.permission.INTERNET"/>\n</manifest>')
              print('Added INTERNET')
          open(p, 'w').write(s)
          PY

      - name: Engine tests
        working-directory: packages/engine
        run: dart pub get && dart test

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - name: Inject signing keystore
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -e
          echo "$KEYSTORE_B64" | base64 -d > android/app/dalicards.jks
          test -s android/app/dalicards.jks
          ls -la android/app/dalicards.jks

      - name: Build release APK
        run: flutter build apk --release

      - name: Align + sign
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASS }}
        run: |
          set -e
          OUT=build/app/outputs/flutter-apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | tail -1)
          "$BT/zipalign" -f 4 "$OUT/app-release.apk" "$OUT/aligned.apk"
          "$BT/apksigner" sign --ks android/app/dalicards.jks \
            --ks-key-alias "$KEYSTORE_ALIAS" \
            --ks-pass "env:KEYSTORE_PASS" \
            --key-pass "env:KEYSTORE_KEY_PASS" \
            --out "$OUT/dalicards-release.apk" "$OUT/aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT/dalicards-release.apk" | head -5
          ls -la "$OUT"/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dalicards-apk
          path: build/app/outputs/flutter-apk/dalicards-release.apk
          if-no-files-found: ignore

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/dalicards-release.apk
          generate_release_notes: true
