name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform scaffolding (never built on Dali's PC)
        run: flutter create --platforms android,web --org ai.dalicards --project-name dalicards .

      - name: Guard - flutter create must not clobber our sources
        run: |
          set -e
          grep -q "DaliCardsApp" lib/main.dart || { echo "FATAL: lib/main.dart was overwritten by flutter create"; exit 1; }
          grep -q "HubScreen" lib/ui/hub/hub_screen.dart || { echo "FATAL: hub_screen.dart overwritten"; exit 1; }
          echo "sources intact"

      - name: Drop the scaffold test flutter create drops in
        run: |
          set -e
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart; then
            rm test/widget_test.dart
            echo "removed the generated MyApp smoke test"
          fi
          ls test/

      - name: Engine tests (pure Dart, no Flutter)
        working-directory: packages/engine
        run: |
          dart pub get
          dart test --reporter expanded

      - name: Install deps
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Widget tests
        run: flutter test --reporter expanded

  web:
    name: build web + deploy pages
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to push the built site to gh-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter create --platforms android,web --org ai.dalicards --project-name dalicards .

      - run: flutter pub get

      - name: Build web
        run: flutter build web --release

      - name: Screenshot the built app
        continue-on-error: true
        run: |
          set -e
          cd build/web
          python3 -m http.server 8099 >/dev/null 2>&1 &
          SRV=$!
          sleep 3
          mkdir -p shots
          for size in "1440,900,desktop" "412,915,phone"; do
            IFS=',' read -r w h name <<< "$size"
            google-chrome --headless=new --no-sandbox --disable-gpu \
              --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader \
              --hide-scrollbars --force-device-scale-factor=2 \
              --window-size=$w,$h --virtual-time-budget=20000 \
              --screenshot=shots/$name.png http://localhost:8099/ || true
          done
          kill $SRV || true
          ls -la shots/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-shots
          path: build/web/shots
          if-no-files-found: ignore

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy web ${{ github.sha }}"
