name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform scaffolding (never built on Dali's PC)
        run: flutter create --platforms android,web --org ai.dalicards --project-name dalicards .

      - name: Guard - flutter create must not clobber our sources
        run: |
          set -e
          # Every file the app is made of. If flutter create ever eats one of
          # these, the analyzer will fail with a confusing "URI doesn't exist"
          # instead of the real cause, so check them by name.
          for f in \
            lib/main.dart \
            lib/theme.dart \
            lib/l10n/app_strings.dart \
            lib/games/registry.dart \
            lib/ui/game/table_screen.dart \
            lib/ui/hub/hub_screen.dart \
            lib/ui/cards/playing_card.dart \
            lib/ui/chkobba/chkobba_controller.dart \
            lib/ui/chkobba/chkobba_setup.dart \
            lib/ui/chkobba/chkobba_table.dart \
            packages/engine/lib/src/bots/chkobba_bot.dart
          do
            [ -f "$f" ] || { echo "FATAL: $f is missing after flutter create"; exit 1; }
          done
          grep -q "DaliCardsApp" lib/main.dart || { echo "FATAL: lib/main.dart was overwritten by flutter create"; exit 1; }
          grep -q "HubScreen" lib/ui/hub/hub_screen.dart || { echo "FATAL: hub_screen.dart overwritten"; exit 1; }
          grep -q "class L10nText" lib/l10n/app_strings.dart || { echo "FATAL: app_strings.dart overwritten"; exit 1; }
          # The playable Chkobba table is the whole point of M4: if the scaffold
          # ate the table or the bot, the app would still build and still deploy
          # a hub that opens a game which does not exist.
          grep -q "class ChkobbaTableScreen" lib/ui/chkobba/chkobba_table.dart || { echo "FATAL: chkobba_table.dart overwritten"; exit 1; }
          grep -q "class ChkobbaBot" packages/engine/lib/src/bots/chkobba_bot.dart || { echo "FATAL: chkobba_bot.dart overwritten"; exit 1; }
          echo "sources intact:"
          git ls-files lib

      - name: Drop the scaffold test flutter create drops in
        run: |
          set -e
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart; then
            rm test/widget_test.dart
            echo "removed the generated MyApp smoke test"
          fi
          ls test/

      - name: Engine tests (pure Dart, no Flutter)
        working-directory: packages/engine
        run: |
          dart pub get
          dart test --reporter expanded

      - name: Install deps
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Widget tests
        run: flutter test --reporter expanded

  web:
    name: build web + deploy pages
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to push the built site to gh-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter create --platforms android,web --org ai.dalicards --project-name dalicards .

      - run: flutter pub get

      - name: Build web
        # The app is served from the /dalicards/ SUBPATH, so the base href has to
        # say so. Without it, index.html resolves manifest.json, the CanvasKit
        # files and the service worker against the site ROOT, every one of them
        # 404s, and the app boots to a blank white page. `flutter build` leaves
        # the placeholder `<base href="/">` in place, so this flag is the only
        # thing standing between a green build and a broken site.
        run: flutter build web --release --base-href /dalicards/

      - name: Screenshot the built app
        continue-on-error: true
        run: |
          set -e
          cd build/web
          python3 -m http.server 8099 >/dev/null 2>&1 &
          SRV=$!
          sleep 3
          mkdir -p shots
          # Third field is the ?lang= override, so the RTL build is shot too.
          for size in "1440,900,desktop," "412,915,phone," "412,915,phone-ar,ar" "1440,900,desktop-fr,fr"; do
            IFS=',' read -r w h name lang <<< "$size"
            google-chrome --headless=new --no-sandbox --disable-gpu \
              --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader \
              --hide-scrollbars --force-device-scale-factor=2 \
              --window-size=$w,$h --virtual-time-budget=20000 \
              --screenshot=shots/$name.png "http://localhost:8099/?lang=$lang" || true
          done
          kill $SRV || true
          ls -la shots/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-shots
          path: build/web/shots
          if-no-files-found: ignore

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy web ${{ github.sha }}"

      - name: Verify the DEPLOYED site actually renders
        # Everything above proves the build is fine, and a build can be fine
        # while the deployed site is a blank page: serving from a subpath is
        # exactly that failure, and the pre-deploy screenshot step cannot see it
        # because it serves from the root where `<base href="/">` happens to be
        # correct. So check the real public URL, and treat a suspiciously small
        # screenshot as a failure - a blank 1280x900 page is ~5 KB, a rendered
        # one is 80-200 KB.
        run: |
          set -e
          SITE=https://dali951.github.io/dalicards
          # The subpath assets must resolve under /dalicards/, not at the root.
          for f in manifest.json flutter_bootstrap.js main.dart.js; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/$f")
            echo "$SITE/$f -> $code"
            [ "$code" = "200" ] || { echo "FATAL: $f is not served from the subpath (is --base-href set?)"; exit 1; }
          done
          mkdir -p shots-deployed
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader \
            --hide-scrollbars --force-device-scale-factor=1 \
            --window-size=1280,900 --virtual-time-budget=25000 \
            --screenshot=shots-deployed/deployed.png "$SITE/" || true
          bytes=$(stat -c%s shots-deployed/deployed.png)
          echo "deployed screenshot: $bytes bytes"
          if [ "$bytes" -lt 20000 ]; then
            echo "FATAL: the deployed screenshot is $bytes bytes - that is a BLANK page."
            echo "       The build passed but the site does not render. Check --base-href."
            exit 1
          fi
          echo "deployed site renders"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-shots
          path: shots-deployed
          if-no-files-found: ignore
